version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Si tu backend necesita variables de entorno, agrégalas aquí

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      # Aquí le decimos a Next.js dónde está el backend DENTRO de Docker
      - NEXT_PUBLIC_API_URL=http://backend:8000